repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.5.1
    hooks:
      - id: prettier
        language_version: system
        args:
          - --write
        files: \.(js|jsx|ts|tsx|json|css|scss|md|yaml)$

  - repo: local
    hooks:
      - id: run-backend-tests
        name: Run Django Backend Tests
        entry: bash -c "cd backend && DJANGO_SETTINGS_MODULE=core.settings.development python manage.py test"
        language: system
        always_run: true
        pass_filenames: false
      - id: run-frontend-tests
        name: Run Frontend Tests
        entry: bash -c "source $HOME/.nvm/nvm.sh && nvm use 18 && cd frontend && npm run test"
        language: system
        always_run: true
        pass_filenames: false
        verbose: true
