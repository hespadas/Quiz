[tool.poetry]
name = "dev"
version = "0.1.0"
description = ""
authors = ["henriqueespadas <henriqueep@hotmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.2.9"
djangorestframework = "^3.15.2"
djangorestframework-simplejwt = "^5.3.1"
django-cors-headers = "^4.5.0"
email-validator = "^2.2.0"
drf-yasg = "^1.21.8"
channels = "^4.1.0"
channels-redis = "^4.2.0"
daphne = "^4.1.2"
psycopg = "^3.2.4"
psycopg2-binary = "^2.9.10"
pillow = "^11.3.0"
boto3 = "^1.37.11"
django-storages = "^1.14.5"
drf-nested-routers = "^0.94.1"
openai = "^1.78.0"
httpx = "^0.28.1"
httpcore = "^1.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
ruff = "^0.7.0"
pre-commit = "4.0.1"
coverage = "7.6.4"
pytest-django = "4.9.0"

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'

[tool.ruff]
line-length = 120
ignore = ["PLC0414","E501", "F401"]

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT"]
per-file-ignores = {"manage.py" = ["PLC0415"]}
ignore = ["E501", "F401"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
